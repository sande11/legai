name: legai
description: "LegAI: an AI legal assistant you can type to, talk to, or have listen in."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # State management & architecture
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0

  # Backend / config
  supabase_flutter: ^2.18.3
  dotenv: ^4.2.0
  flutter_dotenv: ^6.0.1

  # Local storage
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6

  # Speech & audio (all on-device)
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  stt_record: ^0.0.8
  just_audio: ^0.10.6
  audio_session: ^0.2.4

  # UI
  lucide_icons_flutter: ^3.1.25
  intl: ^0.20.3
  uuid: ^4.6.0
  share_plus: ^13.3.1

  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0B0B0C"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
    # Presentation fakes: remove these two lines together with lib/fakes/.
    - assets/fakes/
    - assets/fakes/audio/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Regular.ttf
          weight: 400
        - asset: assets/fonts/Newsreader-Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Newsreader-Italic.ttf
          weight: 400
          style: italic
